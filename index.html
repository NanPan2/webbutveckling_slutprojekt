<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VäderKollen</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="img/logo.svg" alt="logga" width="40" height="40" class="me-2">
                VäderKollen
            </a>
        </div>
    </nav>

    <main class="container my-5">

        <div class="row justify-content-center mb-5">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="text-center mb-4">Sök väder</h1>
                        <form id="search-form">
                            <div class="input-group input-group-lg">
                                <input type="text" id="city-input" class="form-control" placeholder="t.ex. Stockholm" required>
                                <button class="btn btn-primary" type="submit">
                                    <i class="bi bi-search"></i> Sök
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div id="loading" class="text-center d-none">
            <div class="spinner-border" role="status"></div>
            <p>Laddar...</p>
        </div>

        <div id="error-message" class="row justify-content-center d-none">
            <div class="col-md-8 col-lg-6">
                <div class="alert alert-danger text-center">
                    <span id="error-text"></span>
                </div>
            </div>
        </div>

        <div id="weather-result" class="row justify-content-center d-none">
            <div class="col-md-8 col-lg-6">
                <div class="card weather-card shadow">
                    <div class="card-body text-center p-4">
                        <h2 id="city-name" class="mb-1"></h2>
                        <p id="country" class="text-muted mb-3"></p>

                        <div class="weather-icon-container mb-3">
                            <img id="weather-icon" src="" alt="väder" class="weather-icon">
                        </div>
                        <h3 id="temperature" class="display-4 fw-bold mb-1"></h3>
                        <p id="description" class="text-capitalize text-muted fs-5"></p>

                        <hr>
                        <div class="row text-center mt-3">
                            <div class="col-4">
                                <i class="bi bi-thermometer-half fs-4"></i>
                                <p class="mb-0 fw-bold" id="feels-like"></p>
                                <small class="text-muted">Känns som</small>
                            </div>
                            <div class="col-4">
                                <i class="bi bi-droplet-fill fs-4"></i>
                                <p class="mb-0 fw-bold" id="humidity"></p>
                                <small class="text-muted">Luftfuktighet</small>
                            </div>
                            <div class="col-4">
                                <i class="bi bi-wind fs-4"></i>
                                <p class="mb-0 fw-bold" id="wind-speed"></p>
                                <small class="text-muted">Vind</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="forecast-section" class="row justify-content-center mt-4 d-none">
            <div class="col-md-10 col-lg-8">
                <h3 class="text-center mb-3">5-dagars prognos</h3>
                <div id="forecast-cards" class="row g-2 justify-content-center"></div>
            </div>
        </div>

    </main>

    <footer class="text-light py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">VäderKollen - Slutprojekt</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
